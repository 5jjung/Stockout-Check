name: 시즌 신상품 품절 체크

on:
  schedule:
    # GitHub 예약 실행 최소 간격은 5분 (혼잡하면 몇 분 늦어질 수 있음). 시각은 UTC 기준.
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시트·슬랙에 쓰지 않고 결과만 보기'
        type: boolean
        default: false
      send_status:
        description: '이번 실행에서 상태 알림(이상 없음)을 꼭 보내기'
        type: boolean
        default: false

# 이전 실행이 안 끝났으면 겹쳐 돌지 않도록
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 품절 체크
        run: npm run check
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          WEBAPP_TOKEN: ${{ secrets.WEBAPP_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          HEARTBEAT: ${{ inputs.send_status && 'every' || vars.HEARTBEAT }}
          # 이 날짜(한국시간)까지만 10분마다 '이상 없음' 알림, 다음 날부터 1시간마다
          HEARTBEAT_EVERY_UNTIL: '2026-11-22'
