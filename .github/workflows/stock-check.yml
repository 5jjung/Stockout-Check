name: 시즌 신상품 품절 체크

on:
  # 목록 방식 검증이 끝나면 아래 두 줄의 # 을 지워 10분 자동 실행을 켭니다.
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '시트·슬랙에 쓰지 않고 결과만 보기'
        type: boolean
        default: false

# 이전 실행이 안 끝났으면 겹쳐 돌지 않도록
concurrency:
  group: stock-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 품절 체크
        run: npm run check
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
